name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check index.js && node --check client.js && node --check tests/smoke.mjs
      - name: Smoke test (isolated HOME)
        run: node tests/smoke.mjs
